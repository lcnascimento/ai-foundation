name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate --strict .

      - name: Validate each plugin
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            echo "== ${dir} =="
            claude plugin validate --strict "${dir%/}"
          done

      - name: Smoke install in an isolated CLAUDE_CONFIG_DIR
        run: scripts/smoke-install.sh

  principles-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml

      - name: Principles index hook contract
        run: tests/principles-index.test.sh

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml

      - name: Provenance check tests
        run: tests/check-provenance.test.sh

      - name: Provenance of vendored and derived skills
        run: scripts/check-provenance.py
